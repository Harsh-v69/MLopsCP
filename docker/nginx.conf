server {
  listen 8080;
  root /usr/share/nginx/html;
  # Re-resolve `api` every few seconds (Docker's resolver) so a recreated or scaled API is found
  # without restarting this container; with a variable, nginx resolves at request time.
  resolver 127.0.0.11 valid=5s;
  location /api/ {
    set $upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
  location / { try_files $uri /index.html; }
}
