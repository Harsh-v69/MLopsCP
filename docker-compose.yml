version: "3.9"

# Grows phase by phase — see progress.md for what each service is and
# which phase added it. Airflow/postgres/dashboard land in later phases.
services:
  data-loader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/app/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
