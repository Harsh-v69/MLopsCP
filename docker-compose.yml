# Only `web` is published (to localhost). `api` has no published port but keeps
# outbound access, which the dependency scan needs to reach the OSV database.
services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    volumes:
      - state:/state
      - audit:/app/data/audit
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

volumes:
  state:
  audit:
